# Mirrors the real-world pattern found in Snowflake-Labs/Workspace-Estimator
# (we-release-package.yml:46) — PR title injected directly into run: steps.
name: Jira Issue Sync

on:
  pull_request:
    types: [opened, edited]

jobs:
  create-jira-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log PR details
        run: |
          echo "New PR: ${{ github.event.pull_request.title }}"

      - name: Create Jira issue
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $JIRA_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"summary": "${{ github.event.pull_request.title }}", "number": ${{ github.event.pull_request.number }}}' \
            https://snowflake.atlassian.net/rest/api/3/issue
